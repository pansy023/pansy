# XcodeGen 工程描述。
#
# 在 macOS 上执行：  cd <工程根> && xcodegen generate
# 生成 `Kebiao.xcodeproj` 后用 Xcode 打开即可（阶段⑥）。
#
# ⚠️ 本机（Windows）既没有 xcodegen 也没有 Xcode，**这份文件从未被 xcodegen 解析验证过**。
#    它描述的是「在 Mac 上应该生成什么」，不是「已经生成成功」。
#
# 目录约定：
#   apps/Kebiao/          ← SwiftUI App（界面层），依赖本地 package KebiaoCore
#   KebiaoCore/           ← Swift Package（模型 / 算法 / 存储），可脱离 Xcode 用 `swift test` 跑
#   apps/KebiaoWidget/    ← 阶段⑤（WidgetKit），**尚未创建**，所以下面的 target 先注释掉

name: Kebiao

options:
  bundleIdPrefix: com.kebiaocom.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    # ⚠️ 这里写的是**语言模式**，不是 Swift 工具链版本 —— 对应 `swiftc -swift-version`，
    #    它只认 4 / 4.2 / 5 / 6。原先误写成 5.9（那是 `swift-tools-version` 的写法，
    #    见 KebiaoCore/Package.swift），有被 swiftc 直接拒收的风险。
    #    5.0 = Swift 5 语言模式，正是本工程想要的（数据竞争检查只报警告，不报错）。
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 阶段⑦：填入自己的 Apple 开发者 Team ID 后再签名到真机
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES

packages:
  KebiaoCore:
    path: KebiaoCore

targets:
  Kebiao:
    type: application
    platform: iOS
    sources:
      - path: apps/Kebiao
    dependencies:
      - package: KebiaoCore
        product: KebiaoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kebiaocom.example.kebiao
        PRODUCT_NAME: Kebiao
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Android 版只针对手机，iOS 也先只做 iPhone（避免为 iPad 做未验证的布局）
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # 应用图标：apps/Kebiao/Assets.xcassets/AppIcon.appiconset
        # （图形取自安卓端 mipmap/ic_launcher，不重绘，仅等比缩放到 iOS 各档）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # `apps/KebiaoTests` 里用 `@testable import Kebiao`（要访问 internal 的
        # `AppEnvironment`），这要求宿主 App 在 Debug 下可测试。显式写死，
        # 不依赖 Xcode 模板的隐含默认值。
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: apps/Kebiao/Info.plist
      properties:
        CFBundleDisplayName: 上课早枝道
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 阶段⑤：自动刷新用 BGAppRefreshTask（依据 docs/recon/03-reminder-and-refresh.md §6）
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        # 阶段④ ATS 例外：2026-10-17 真机实测后补上（见 docs/recon/02-jwxt-login-and-parser.md）。
        #
        # 真机证据：教务登录后报 NSURLErrorDomain Code=-1022
        # 「The resource could not be loaded because the App Transport Security policy requires the
        #   use of a secure connection.」，失败 URL = http://jwgl.xihang.com.cn/jsxsd/framework/xsrkxz.htmlx
        # ⇒ 服务器把跳转指回了 http 明文地址，iOS 的 ATS 直接拒载。
        # 会话层第一跳已经是 https（`JwxtSession.secureURLString` 的强制提升），但**重定向跟随是照搬
        # Android 逻辑**（拿到 `Location` 就跳）；Android 的 jsoup 没有 ATS，所以安卓端能过、iOS 被拦。
        #
        # 因此按**实测地址**做**域名级**例外：只放开该教务域名（含子域）的明文 HTTP，
        # 其余域名仍保持 iOS 默认的「禁止明文」。
        # ⚠️ 若以后把设置页里的教务地址换成别的域名，需要在这里再加一条。
        NSAppTransportSecurity:
          NSExceptionDomains:
            jwgl.xihang.com.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  # ── App 层单元测试（XCTest，宿主 = Kebiao.app）────────────────
  #
  # 和 `KebiaoCore` 的 `swift test` **不是一回事**：
  # - `swift test` 跑的是纯逻辑包，看不到 App 宿主模块 `Kebiao`；
  # - 这个 target 用 `@testable import Kebiao` 直接测 App 层代码
  #   （当前覆盖 `AppEnvironment` —— 本轮 P0-1「状态不转发导致界面不刷新」
  #    的回归防线）。
  #
  # `TEST_HOST` / `BUNDLE_LOADER` 显式写死：app-hosted 单测必须把宿主 App 作为
  # 加载器才能 `@testable import`，否则编不过。
  KebiaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apps/KebiaoTests
    dependencies:
      - target: Kebiao
      - package: KebiaoCore
        product: KebiaoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kebiaocom.example.kebiao.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kebiao.app/Kebiao"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # ── UI 自动化测试（XCUITest）─────────────────────────────────
  #
  # 与 `KebiaoCore` 的 `swift test` **不是一回事**：`swift test` 只跑纯逻辑，
  # 从不编译 App、从不启动模拟器。这个 target 才是「真在 iPhone 模拟器里启动
  # App、找界面元素、点击、输入、切开关并断言」的那一层。
  #
  # `TEST_TARGET_NAME: Kebiao` 告诉测试包「要驱动哪个宿主 App」；
  # `bundle.ui-testing` 生成的 `KebiaoUITests-Runner.app` 由 xcodebuild 自动装上
  # 模拟器并运行，不需要开发者证书。
  #
  # 用例在 `apps/KebiaoUITests/`（见该目录下的说明），全部通过
  # accessibilityIdentifier 定位，不依赖中文文案。
  KebiaoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: apps/KebiaoUITests
    dependencies:
      - target: Kebiao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kebiaocom.example.kebiao.uitests
        TEST_TARGET_NAME: Kebiao
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # ── 阶段⑤ 桌面小组件（WidgetKit）─────────────────────────────
  # 目录 `apps/KebiaoWidget/` 尚未创建，且**还没有 WidgetKit 的取证/设计文档**
  # （Android 的 RemoteViews 布局不能照搬），所以先不声明 target。
  # 届时取消注释并补上目录：
  #
  # KebiaoWidget:
  #   type: app-extension
  #   platform: iOS
  #   sources:
  #     - path: apps/KebiaoWidget
  #   dependencies:
  #     - package: KebiaoCore
  #       product: KebiaoCore
  #     - target: Kebiao
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.kebiaocom.example.kebiao.widget
  #   info:
  #     path: apps/KebiaoWidget/Info.plist
  #     properties:
  #       NSExtension:
  #         NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Kebiao:
    build:
      targets:
        Kebiao: all
        # 测试包只在 `test` 动作里构建，正常 `build` / 归档时不参与。
        KebiaoTests: [test]
        KebiaoUITests: [test]
    run:
      config: Debug
    # `xcodebuild test -scheme Kebiao` 会跑这一组：先 app-hosted 单元测试，
    # 再真启动模拟器跑 XCUITest。
    # 只想跑其中一层时用 `-only-testing:KebiaoTests` / `-only-testing:KebiaoUITests`
    # （CI 就是这么把两者的失败互相隔离开的，见 .github/workflows/ios-build.yml）。
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KebiaoTests
        - KebiaoUITests
    # KebiaoCore 的单元测试不属于 App target，用 `swift test` 在 KebiaoCore/ 下跑
    # （见 README.md §4）。不要在这里加 package 的测试 target，XcodeGen 的
    # scheme.test.targets 只接受本工程内的 target。
