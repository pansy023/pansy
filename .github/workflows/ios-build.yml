# 云端 macOS 构建：本机是 Windows，没有 Xcode / xcodegen / swift 工具链，
# 所以把「真编译 + 真跑单测」这件事交给 GitHub 的 macOS runner。
#
# 两个 job 刻意**互不依赖**：单测挂了也要看得到编译错误，编译挂了也要看得到单测结果。
#
# 产出物 `Kebiao-unsigned.ipa` 是**未签名**包，不能直接装。它的用途是拿到 Windows 侧
# 用 SideStore / AltStore 配合你自己的 Apple ID 重新签名后装到 iPhone
# （免费 Apple ID 签出来的证书 7 天过期，到期需重签）。
#
# ⚠️ 本文件同样从未被执行过 —— 它是「第一次 push 到 GitHub 之后会发生什么」的声明。

name: iOS build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── KabiaoCore 纯逻辑层的真实单测 ────────────────────────────────
  #
  # 这是全工程唯一能「真跑起来」的验证：周次判断、单双周、Java String.hashCode()
  # 配色、卡片几何、时间槽、存储往返。App 界面层不在这里。
  core-tests:
    name: KebiaoCore 单元测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打印工具链版本
        run: |
          swift --version
          xcodebuild -version

      - name: swift test
        working-directory: KebiaoCore
        run: swift test --parallel

  # ── App：生成 Xcode 工程 → 编译 iOS 真机包 → 打包未签名 IPA ──────
  app-build:
    name: 生成工程并编译 iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Kebiao.xcodeproj
        run: xcodegen generate

      # 未签名编译。`CODE_SIGNING_ALLOWED=NO` 一起关掉签名与描述文件校验，
      # 这样不需要任何证书 / Provisioning Profile 也能验证「代码是否真的能编译」。
      - name: 编译（iPhone 真机，未签名）
        run: |
          xcodebuild \
            -project Kebiao.xcodeproj \
            -scheme Kebiao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 编不出来就直接失败，绝不产出一个空壳 IPA 冒充成功。
      - name: 校验产物存在并打印关键字段
        run: |
          APP="build/Build/Products/Release-iphoneos/Kebiao.app"
          test -d "$APP" || { echo "::error::没有生成 $APP，编译实际失败"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: 打包未签名 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Kebiao.app"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Kebiao-unsigned.ipa Payload
          ls -l Kebiao-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kebiao-unsigned-ipa
          path: Kebiao-unsigned.ipa
          if-no-files-found: error

  # ── App 单元测试 + iPhone 模拟器 XCUITest ────────────────────────
  #
  # 与另外两个 job 的区别（三者不能互相替代）：
  # - `core-tests`：`swift test`，只跑纯逻辑包，不编译 App、不启动模拟器；
  # - `app-build` ：只证明「代码能编译」，不证明「界面能用」；
  # - 本 job      ：App 层单元测试（`@testable import Kebiao`，宿主 App 里跑）
  #                 + 把 App 装进 iPhone 模拟器、跑 UI 用例、看真实截图。
  #
  # 规矩：**任一测试失败 ⇒ 本 job 失败 ⇒ 整个 workflow 失败**。
  # 不跳过用例、不删断言、不改预期来让 CI 变绿；模拟器不可用就明确报错退出。
  ui-tests:
    name: App 单元测试 + iPhone 模拟器 XCUITest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打印 Xcode 版本与已安装的模拟器运行时
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Kebiao.xcodeproj
        run: xcodegen generate

      - name: 列出可用模拟器设备
        run: xcrun simctl list devices available

      - name: 选择一台可用的 iPhone 模拟器
        id: sim
        run: |
          set -euo pipefail
          INFO=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if name.startswith("iPhone"):
                      candidates.append((runtime, name, device.get("udid", "")))
          if not candidates:
              print("")
              sys.exit(0)
          def version_key(item):
              runtime = item[0]
              version = runtime.split("iOS-")[-1].replace("-", ".")
              parts = [int(p) for p in version.split(".") if p.isdigit()]
              return parts
          candidates.sort(key=version_key)
          runtime, name, udid = candidates[-1]
          print(f"{udid}|{name}|{runtime}")
          ')
          if [ -z "$INFO" ]; then
            echo "::error::没有找到任何可用的 iPhone 模拟器设备，无法在不伪造结果的前提下运行 XCUITest。"
            xcrun simctl list devices
            exit 1
          fi
          # 输出格式是 "udid|名字|runtime"，拆开打印，方便事后核对「到底跑在哪台设备上」。
          UDID="${INFO%%|*}"
          REST="${INFO#*|}"
          SIM_NAME="${REST%%|*}"
          SIM_RUNTIME="${REST#*|}"
          echo "选中的模拟器：$SIM_NAME（runtime=$SIM_RUNTIME，UDID=$UDID）"
          xcrun simctl list devices available > simctl-devices.txt
          cat simctl-devices.txt
          {
            echo "udid=$UDID"
            echo "simulator_name=$SIM_NAME"
            echo "simulator_runtime=$SIM_RUNTIME"
          } >> "$GITHUB_OUTPUT"

      # 两层测试刻意**分开两步**跑：单元测试挂了也要把 XCUITest 跑完，
      # 否则「界面到底能不能用」这件事会被单元测试的失败掩盖掉。
      # 两步都用 `continue-on-error: true` 记录 outcome，最后由末尾的闸门步骤
      # 统一让本 job（进而整个 workflow）明确失败 —— 不静默跳过、不把失败算成通过。
      - name: 运行 App 层单元测试（XCTest，宿主 Kebiao.app）
        id: unit_tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf UnitTestResults.xcresult
          xcodebuild test \
            -project Kebiao.xcodeproj \
            -scheme Kebiao \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath UnitTestResults.xcresult \
            -only-testing:KebiaoTests \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-unittest.log

      - name: 运行 XCUITest（真启动 App 与模拟器）
        id: ui_tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project Kebiao.xcodeproj \
            -scheme Kebiao \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -only-testing:KebiaoUITests \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-test.log

      - name: 汇总测试结果
        if: always()
        run: |
          echo "单元测试步骤结果：${{ steps.unit_tests.outcome }}"
          echo "XCUITest 步骤结果：${{ steps.ui_tests.outcome }}"
          for bundle in UnitTestResults.xcresult TestResults.xcresult; do
            if [ -d "$bundle" ]; then
              echo "──────── $bundle ────────"
              xcrun xcresulttool get test-results summary --path "$bundle" \
                || echo "（无法解析 $bundle 的 summary，请下载 artifact 查看）"
            else
              echo "::warning::没有生成 $bundle，该层测试没有产出报告"
            fi
          done

      # 失败截图单独导出来：XCUITest 把自动截图挂在 xcresult 里，Xcode 16+ 的
      # `xcresulttool export attachments` 能把它们导成 PNG。有了这一步，
      # 「某个按钮存在但点不到」这类问题可以直接看图定位，不必猜。
      # 本步只负责收集证据，自身失败不影响测试判定（continue-on-error）。
      - name: 导出失败截图与设备清单（诊断用）
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ui-test-attachments
          xcrun simctl list devices available > simctl-devices.txt 2>&1 || true
          # 日志由前面的测试步骤 `tee` 落下来。万一某步根本没跑，
          # 这里补一个说明文件，免得上传步骤因「找不到任何文件」而报错却看不到原因。
          for f in xcodebuild-unittest.log xcodebuild-test.log; do
            [ -f "$f" ] || echo "（该步骤没有产出日志）" > "$f"
          done
          for bundle in TestResults.xcresult UnitTestResults.xcresult; do
            if [ -d "$bundle" ]; then
              name="$(basename "$bundle" .xcresult)"
              xcrun xcresulttool export attachments \
                --path "$bundle" \
                --output-path "ui-test-attachments/$name" \
                && echo "已导出 $bundle 的附件（含失败截图）" \
                || echo "::warning::$bundle 附件导出失败，请直接下载 xcresult 查看"
            fi
          done
          ls -R ui-test-attachments | head -80

      # 失败也要能看到报告与失败截图（截图由 XCUITest 自动挂进 xcresult，
      # 另有用例自身的 XCTAttachment 截图）。
      #
      # `if-no-files-found: error`：正常情况下上面的步骤保证了日志、设备清单、
      # 附件目录至少有一个存在；真出现「一个文件都没有」就说明本 job 连证据都没
      # 收集到，此时宁可让本步明确报错，也不要静默地交出一个空 artifact。
      - name: 上传测试报告、日志与失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kebiao-uitest-results
          path: |
            TestResults.xcresult
            UnitTestResults.xcresult
            ui-test-attachments
            simctl-devices.txt
            xcodebuild-test.log
            xcodebuild-unittest.log
          if-no-files-found: error

      # 唯一判定入口：任何一层测试没通过（含「模拟器挑不到」「编译失败」），
      # 本 job 明确失败。不用 `|| true` 之类的手段把失败吞掉。
      - name: 测试未全部通过即让工作流失败
        if: always()
        run: |
          UNIT="${{ steps.unit_tests.outcome }}"
          UI="${{ steps.ui_tests.outcome }}"
          if [ "$UNIT" != "success" ] || [ "$UI" != "success" ]; then
            echo "::error::测试未全部通过（App 单元测试=$UNIT，XCUITest=$UI），本 job 明确失败；报告与日志见 artifact Kebiao-uitest-results。"
            exit 1
          fi
          echo "App 单元测试与 XCUITest 均通过。"
